name: verify
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-verify-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-verify-
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test -p escrow-core --lib --locked
      - run: cargo test -p escrow-engine --test sync_ops_worker --locked